[package]
authors = ["Ballerina"]
distribution = "2201.12.0"
keywords = ["Vendor/Google", "Area/AI & Machine Learning", "Type/Embedding Provider", "Type/Model Provider", "Type/Connector", "Name/Google Gemini Model/Embedding Provider"]
license = ["Apache-2.0"]
icon="icon.png"
name = "ai.google.gemini"
org = "ballerinax"
repository = "https://github.com/ballerina-platform/module-ballerinax-ai.google.gemini"
version = "1.0.2"

# TODO: drop this block and let `ballerina/ai` resolve from Ballerina Central once a release
# carrying the finalized streaming contract (`chatAsStream`/`generateAsStream`, the flat
# `ChatMessageChunk` type) is published. No published version has it yet — 1.13.0 and
# 1.14.0 on Central both predate it — so it is pinned to the local repository, populated
# with `bal pack && bal push --repository=local` from module-ballerina-ai on branch
# `feat/add-chat-stream-support`.
[[dependency]]
org = "ballerina"
name = "ai"
version = "1.13.0"
repository = "local"

[platform.java21]
graalvmCompatible = true

[[platform.java21.dependency]]
groupId = "io.ballerina.lib"
artifactId = "ai.google.gemini-native"
version = "1.0.2"
path = "../native/build/libs/ai.google.gemini-native-1.0.2-SNAPSHOT.jar"
